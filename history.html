<script>
/* Mapping modul ke URL page -- sekarang di shared.js (raModulToUrl/
   raModulToPrintUrl), dipakai juga oleh raRetryPendingFirebaseSyncs().
   Alias nama lokal dipertahankan supaya baris lain di file ini tidak perlu
   diubah. */
function modulToUrl(modul, id) { return raModulToUrl(modul, id); }
function modulToPrintUrl(modul, id) { return raModulToPrintUrl(modul, id); }

/* Badge status laporan -- alur Checker/Reviewer/SPV sudah dihapus, jadi
   status yang ada sekarang cuma DRAFT (belum submit) dan SUBMITTED (sudah
   diminta kirim ke Review Approval Dashboard). Status lama (CHECKED/RETURNED/
   FINAL_APPROVED) masih mungkin nempel di data lama sebelum revert ini --
   fallback ke DRAFT lewat historyStatusBadge() kalau ketemu. */
var HISTORY_STATUS_MAP = {
  DRAFT:     { label: 'Draft',     bg: '#fef3c7', fg: '#92400e' }, // kuning
  SUBMITTED: { label: 'Submitted', bg: '#dbeafe', fg: '#1e40af' }  // biru
};
/* SUBMITTED tidak selalu berarti sudah beneran nyampe di Firebase --
   firebase_synced_at null berarti masih diproses/dicoba ulang di latar
   belakang oleh raRetryPendingFirebaseSyncs() (shared.js). Badge kedua ini
   kasih tahu bedanya tanpa bikin user panik "gagal" padahal cuma nunggu. */
function historyFirebaseBadge(status, firebaseSyncedAt) {
  if ((status || 'DRAFT').toUpperCase() !== 'SUBMITTED') return '';
  if (firebaseSyncedAt) return '<span style="display:inline-block;margin-left:4px;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:700;background:#d1fae5;color:#065f46">✓ Dashboard</span>';
  return '<span style="display:inline-block;margin-left:4px;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:700;background:#f3f4f6;color:#6b7280" title="Belum sukses terkirim ke Review Approval Dashboard -- otomatis dicoba lagi di latar belakang selama ada koneksi">⏳ Menyusul</span>';
}
function historyStatusBadge(status) {
  var s = HISTORY_STATUS_MAP[(status || 'DRAFT').toUpperCase()] || HISTORY_STATUS_MAP.DRAFT;
  return '<span style="display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:700;background:'+s.bg+';color:'+s.fg+'">'+s.label+'</span>';
}

function loadHistory(modul) {
  var container = document.getElementById('historyList');
  container.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text3)">Memuat...</div>';
  dbList(modul, function(rows) {
    if (!rows.length) {
      container.innerHTML = '<div style="text-align:center;padding:32px;color:var(--text3);font-size:13px">Belum ada data tersimpan.</div>';
      return;
    }
    var html = '<table class="manual-table" style="width:100%;font-size:12px">'+
      '<thead><tr><th>Modul</th><th>Tanggal</th><th>PIC</th><th>Work Order</th><th>Status</th><th>Disimpan</th><th>Aksi</th></tr></thead><tbody>';
    rows.forEach(function(r) {
      var saved = dbFmtLocalDateTime(r.updated_at);
      var openUrl = modulToUrl(r.modul, r.id);
      var printUrl = modulToPrintUrl(r.modul, r.id);
      var delBtn = '<button onclick="historyDelete(\''+r.id+'\')" style="padding:4px 10px;font-size:11px;background:var(--fail);color:#fff;border:none;border-radius:4px;cursor:pointer">&#128465;</button>';
      // Tombol Submit buat laporan yang masih DRAFT. Tombol Resubmit (beda
      // warna, oranye) khusus laporan yang SUDAH SUBMITTED tapi BELUM
      // sukses nyampe ke Review Approval Dashboard (firebase_synced_at
      // masih kosong -- lihat historyFirebaseBadge "⏳ Menyusul") --
      // raRetryPendingFirebaseSyncs() (shared.js) sudah otomatis coba kirim
      // ulang di background tiap halaman dibuka, tombol ini cuma buat user
      // yang mau langsung memicu percobaan tanpa nunggu. Begitu sudah
      // sukses (badge jadi "✓ Dashboard"), tombol ini otomatis hilang lagi.
      // id tombol dipakai historySubmit() buat update tulisan/nonaktifkan
      // tombol ini sendiri begitu proses (di iframe tersembunyi) selesai.
      var submitBtnId = 'histSubmitBtn-' + r.id;
      var statusUp = (r.status || 'DRAFT').toUpperCase();
      var submitBtn = '';
      if (statusUp === 'DRAFT') {
        submitBtn = '<button id="'+submitBtnId+'" onclick="historySubmit(\''+r.id+'\',\''+r.modul+'\')" style="padding:4px 10px;font-size:11px;background:#2563eb;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-right:4px">&#128274; Submit</button>';
      } else if (statusUp === 'SUBMITTED' && !r.firebase_synced_at) {
        submitBtn = '<button id="'+submitBtnId+'" onclick="historySubmit(\''+r.id+'\',\''+r.modul+'\')" style="padding:4px 10px;font-size:11px;background:#f59e0b;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-right:4px">&#128260; Resubmit</button>';
      }
      html += '<tr>'+
        '<td><span class="path-label">'+r.modul+'</span></td>'+
        '<td>'+(r.tanggal||'-')+'</td>'+
        '<td>'+(r.pic||'-')+'</td>'+
        '<td>'+(r.work_order||'-')+'</td>'+
        '<td>'+historyStatusBadge(r.status)+historyFirebaseBadge(r.status, r.firebase_synced_at)+'</td>'+
        '<td style="font-size:10px;color:var(--text3)">'+saved+'</td>'+
        '<td style="white-space:nowrap;text-align:right">'+
          submitBtn+
          '<button onclick="window.location.href=\''+openUrl+'\'" style="padding:4px 10px;font-size:11px;background:var(--ok);color:#fff;border:none;border-radius:4px;cursor:pointer;margin-right:4px">&#9998; Buka</button>'+
          '<button onclick="window.open(\''+printUrl+'\',\'_blank\')" style="padding:4px 10px;font-size:11px;background:#3498db;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-right:4px">&#128438; Print</button>'+
          delBtn+
        '</td></tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  });
}

function historyDelete(id) {
  if (!confirm('Hapus data ini?')) return;
  supaFetch('DELETE', SUPA_TABLE + '?id=eq.' + id)
    .then(function() {
      dbShowToast('Data berhasil dihapus');
      setTimeout(function(){ loadHistory(''); }, 500);
    })
    .catch(function(err){ alert('Gagal hapus: ' + (err.message||err)); });
}

/* ── SUBMIT LANGSUNG DARI RIWAYAT (tanpa buka tab baru) ──
   Halaman modul aslinya dimuat di iframe TERSEMBUNYI (?id=xxx&autosubmit=1)
   -- semua proses (load data, generate PDF, update status Supabase, kirim
   PDF ke Review Approval Dashboard) jalan persis seperti biasa di dalam
   iframe itu, cuma usernya tidak pernah melihat halamannya. Modul yang
   sudah selesai (sukses/gagal) lapor balik lewat postMessage
   (raSubmitReportAuto() di shared.js), ditangkap oleh listener di bawah --
   BARU setelah PDF-nya benar-benar tuntas dikirim (bukan begitu status
   Supabase ke-update), jadi iframe ini tidak akan dibuang sebelum
   waktunya. Timeout di bawah cuma jaring pengaman kalau modulnya
   benar-benar macet total -- KALAU kena timeout ATAU tab ini malah
   ditutup usernya sebelum selesai, laporan TIDAK hilang: statusnya sudah
   SUBMITTED di Supabase, dan raRetryPendingFirebaseSyncs() (shared.js)
   akan otomatis mencoba mengirim ulang PDF-nya di kunjungan berikutnya ke
   halaman mana pun, selama ada koneksi -- tanpa perlu submit ulang
   manual. */
var _histSubmitJobs = {}; // id -> {iframe, btn, timeoutId}

function historySubmit(id, modul) {
  if (_histSubmitJobs[id]) return; // sudah ada proses submit berjalan buat id ini
  if (!confirm('Yakin submit laporan ini ke Review Approval Dashboard?')) return;
  var url = modulToUrl(modul, id);
  if (!url || url === 'index.html') { alert('Modul tidak dikenali, tidak bisa disubmit dari sini.'); return; }
  var btn = document.getElementById('histSubmitBtn-' + id);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Sedang mensubmit...'; btn.style.opacity = '0.75'; }

  var iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = url + '&autosubmit=1';

  // 4 menit -- HARUS lebih besar dari total timeout internal di
  // raSendFinalPdfToFirebaseDashboard (shared.js: 30 detik simpan + 3
  // menit upload PDF = 3.5 menit), supaya laporan besar/banyak foto (mis.
  // Coal Feeder + 4000 Hours Mill) sempat dapat pesan error yang jelas dari
  // sana duluan, bukan keburu dianggap "timeout" di sini padahal masih
  // benar-benar berjalan.
  var timeoutId = setTimeout(function(){
    historySubmitDone(id, false, 'Belum selesai dalam 4 menit -- kemungkinan koneksi lambat (banyak foto). Laporan TETAP tersubmit, akan otomatis dicoba lagi di latar belakang.');
  }, 240000);

  _histSubmitJobs[id] = { iframe: iframe, btn: btn, timeoutId: timeoutId };
  document.body.appendChild(iframe);
}

function historySubmitDone(id, ok, err) {
  var job = _histSubmitJobs[id];
  if (!job) return; // sudah ditangani sebelumnya (mis. timeout duluan lalu pesan asli nyusul)
  delete _histSubmitJobs[id];
  clearTimeout(job.timeoutId);
  if (job.iframe && job.iframe.parentNode) job.iframe.parentNode.removeChild(job.iframe);

  if (ok) {
    if (job.btn) {
      job.btn.disabled = true;
      job.btn.textContent = '✓ Submitted';
      job.btn.style.background = 'var(--ok)';
      job.btn.style.opacity = '1';
    }
    dbShowToast('✓ Laporan berhasil disubmit ke Review Approval Dashboard');
  } else {
    // Bisa dua hal: (a) status Supabase gagal ke-update sama sekali (jarang,
    // biasanya jaringan putus di awal) -- tombol Submit akan muncul lagi
    // setelah reload di bawah karena statusnya masih DRAFT, atau (b) status
    // sudah SUBMITTED tapi kirim PDF-nya belum tuntas -- setelah reload,
    // badge "⏳ Menyusul" muncul dan raRetryPendingFirebaseSyncs() yang
    // melanjutkan otomatis. Tidak perlu dibedakan di sini -- reload di bawah
    // akan menampilkan status yang sebenarnya.
    dbShowToast('⏳ ' + (err || 'Belum selesai, akan dicoba lagi otomatis di latar belakang.'));
  }
  setTimeout(function(){ loadHistory(''); }, 800); // refresh badge status/dashboard sesuai kondisi sebenarnya
}

window.addEventListener('message', function(e) {
  if (!e.data || e.data.type !== 'raAutosubmitDone') return;
  historySubmitDone(e.data.id, !!e.data.ok, e.data.error);
});

/* Auto-load all on open */
loadHistory('');
</script>
