<script>
/* Mapping modul ke URL page -- sekarang di shared.js (raModulToUrl/
   raModulToPrintUrl), dipakai juga oleh raRetryPendingFirebaseSyncs().
   Alias nama lokal dipertahankan supaya baris lain di file ini tidak perlu
   diubah. */
function modulToUrl(modul, id) { return raModulToUrl(modul, id); }
function modulToPrintUrl(modul, id) { return raModulToPrintUrl(modul, id); }

/* Badge status laporan -- 4 tahap sesuai alur nyata di Review Approval
   Dashboard (lihat historyRaStatusBadge untuk 3 tahap terakhir):
     - Draft     (kuning) -- baru disimpan dari html modul, belum disubmit.
     - Submitted (biru)   -- sudah disubmit DAN dapat feedback (confirmed
       sampai di Review Approval Dashboard, firebase_synced_at terisi).
       Ini juga default awal sebelum status Firestore yang lebih spesifik
       (reviewed/approved) berhasil diambil -- lihat historyUpgradeStatusBadges.
     - Reviewed  (kuning) -- sudah direview TechOp2, menunggu approval SPV.
     - Approved  (hijau)  -- sudah disetujui SPV, tuntas.
   Status transisi "SUBMITTED tapi firebase_synced_at belum terisi" (proses
   pengiriman masih berjalan/dicoba ulang di background) bukan salah satu
   dari 4 tahap ini -- tetap abu2 "Menunggu Feedback" seperti sebelumnya.
   Status lama (CHECKED/RETURNED/FINAL_APPROVED, alur Checker/Reviewer/SPV
   Supabase yang sudah dihapus total) masih mungkin nempel di data lama --
   fallback ke Draft kalau ketemu. */
function historyStatusBadge(status, firebaseSyncedAt) {
  var up = (status || 'DRAFT').toUpperCase();
  var s;
  if (up === 'SUBMITTED') {
    s = firebaseSyncedAt
      ? { label: 'Submitted', bg: '#dbeafe', fg: '#1e40af', title: 'Sudah dikonfirmasi sampai di Review Approval Dashboard, menunggu direview.' }
      : { label: '⏳ Menunggu Feedback', bg: '#f3f4f6', fg: '#6b7280', title: 'Sudah disubmit dari sini, tapi belum ada konfirmasi sukses dari Review Approval Dashboard -- otomatis dicoba lagi di latar belakang selama ada koneksi. Bukan berarti gagal.' };
  } else {
    s = { label: 'Draft', bg: '#fef3c7', fg: '#92400e', title: '' };
  }
  return '<span style="display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:700;background:'+s.bg+';color:'+s.fg+'" title="'+s.title+'">'+s.label+'</span>';
}

function loadHistory(modul) {
  var container = document.getElementById('historyList');
  container.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text3)">Memuat...</div>';
  dbList(modul, function(rows) {
    if (!rows.length) {
      container.innerHTML = '<div style="text-align:center;padding:32px;color:var(--text3);font-size:13px">Belum ada data tersimpan.</div>';
      return;
    }
    var html = '<table class="manual-table" style="width:100%;font-size:12px">'+
      '<thead><tr><th>Modul</th><th>Tanggal</th><th>PIC</th><th>Work Order</th><th>Status</th><th>Area</th><th>Disimpan</th><th>Aksi</th></tr></thead><tbody>';
    rows.forEach(function(r) {
      var saved = dbFmtLocalDateTime(r.updated_at);
      var openUrl = modulToUrl(r.modul, r.id);
      var printUrl = modulToPrintUrl(r.modul, r.id);
      var delBtn = '<button onclick="historyDelete(\''+r.id+'\')" style="padding:4px 10px;font-size:11px;background:var(--fail);color:#fff;border:none;border-radius:4px;cursor:pointer">&#128465;</button>';
      // Tombol Submit buat laporan yang masih DRAFT. Tombol Resubmit (beda
      // warna, oranye) khusus laporan yang SUDAH SUBMITTED tapi BELUM
      // sukses nyampe ke Review Approval Dashboard (firebase_synced_at
      // masih kosong -- lihat historyStatusBadge "⏳ Submitted — Menunggu
      // Feedback") -- raRetryPendingFirebaseSyncs() (shared.js) sudah
      // otomatis coba kirim ulang di background tiap halaman dibuka,
      // tombol ini cuma buat user yang mau langsung memicu percobaan tanpa
      // nunggu. Begitu sudah sukses (badge jadi "✓ Tersubmit"), tombol ini
      // otomatis hilang lagi.
      // id tombol dipakai historySubmit() buat update tulisan/nonaktifkan
      // tombol ini sendiri begitu proses (di iframe tersembunyi) selesai.
      var submitBtnId = 'histSubmitBtn-' + r.id;
      var statusUp = (r.status || 'DRAFT').toUpperCase();
      var submitBtn = '';
      if (statusUp === 'DRAFT') {
        submitBtn = '<button id="'+submitBtnId+'" onclick="historySubmit(\''+r.id+'\',\''+r.modul+'\')" style="padding:4px 10px;font-size:11px;background:#2563eb;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-right:4px">&#128274; Submit</button>';
      } else if (statusUp === 'SUBMITTED' && !r.firebase_synced_at) {
        submitBtn = '<button id="'+submitBtnId+'" onclick="historySubmit(\''+r.id+'\',\''+r.modul+'\')" style="padding:4px 10px;font-size:11px;background:#f59e0b;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-right:4px">&#128260; Resubmit</button>';
      }
      html += '<tr>'+
        '<td><span class="path-label">'+r.modul+'</span></td>'+
        '<td>'+(r.tanggal||'-')+'</td>'+
        '<td>'+(r.pic||'-')+'</td>'+
        '<td>'+(r.work_order||'-')+'</td>'+
        '<td id="histStatusCell-'+r.id+'">'+historyStatusBadge(r.status, r.firebase_synced_at)+'</td>'+
        '<td>'+historyAreaLabel(r.modul)+'</td>'+
        '<td style="font-size:10px;color:var(--text3)">'+saved+'</td>'+
        '<td style="white-space:nowrap;text-align:right">'+
          submitBtn+
          '<button onclick="window.location.href=\''+openUrl+'\'" style="padding:4px 10px;font-size:11px;background:var(--ok);color:#fff;border:none;border-radius:4px;cursor:pointer;margin-right:4px">&#9998; Buka</button>'+
          '<button onclick="window.open(\''+printUrl+'\',\'_blank\')" style="padding:4px 10px;font-size:11px;background:#3498db;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-right:4px">&#128438; Print</button>'+
          delBtn+
        '</td></tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
    historyUpgradeStatusBadges(rows);
  });
}

/* Label Area per baris riwayat -- kosakata SAMA persis dengan <option>
   filter Area di index.html (bukan label Firestore-nya RA_AREA_LABEL_C7,
   yang lebih verbose dan buat keperluan lain). Dibaca dari RA_MODUL_AREA
   (shared.js) berdasarkan modul laporan itu sendiri -- satu-satunya sumber
   data, tidak diduplikasi ke sini. Modul yang belum dipetakan (mis.
   Maintenance Report) tampil "-". */
var HIST_AREA_LABEL = { boiler: 'Boiler', turbine: 'Turbine', common: 'Common CHCB', wwtp: 'Common WWTP' };
function historyAreaLabel(modul) {
  if (typeof RA_MODUL_AREA === 'undefined' || typeof normalizeModul !== 'function') return '-';
  var area = RA_MODUL_AREA[normalizeModul(modul)];
  return area ? (HIST_AREA_LABEL[area] || area) : '-';
}

/* ── STATUS SUNGGUHAN dari Review Approval Dashboard (Firestore) ──
   Sebelumnya history.html cuma tahu "sudah terkirim" (firebase_synced_at)
   atau belum -- tidak pernah tahu status SEBENARNYA di sana (menunggu
   review/approval, disetujui, atau dikembalikan ke teknisi). Sekarang tiap
   baris yang sudah tersinkron (dan punya firebase_checksheet_id -- lihat
   migration 010, cuma laporan yang disubmit SETELAH migration ini jalan
   yang punya kolom ini) di-query balik ke koleksi `approvals` Firestore
   lewat Approvals.getByChecksheetId(), lalu badge status-nya di-upgrade
   di tempat begitu jawabannya datang -- tidak memblokir render tabel awal
   sama sekali (badge "✓ Tersubmit" tampil dulu sebagai default sambil
   nunggu). Laporan lama yang belum punya firebase_checksheet_id (disubmit
   SEBELUM migration 010) tetap nampilkan "✓ Tersubmit" apa adanya -- tidak
   ada cara mundur mencari tahu checksheetId-nya. */
function historyUpgradeStatusBadges(rows) {
  if (typeof Approvals === 'undefined' || typeof db === 'undefined') return; // firebase-config.js/approval-helper.js belum termuat
  var tasks = rows.filter(function(r) {
    return r.firebase_synced_at && r.firebase_checksheet_id;
  }).map(function(r) {
    return function() {
      return Approvals.getByChecksheetId(r.firebase_checksheet_id).then(function(appr) {
        if (!appr) return;
        var cell = document.getElementById('histStatusCell-' + r.id);
        if (cell) cell.innerHTML = historyRaStatusBadge(appr.status);
        if (appr.status && appr.status !== r.ra_notified_status) raSendTelegramNotif(r, appr);
      }).catch(function(){}); // gagal query 1 baris tidak boleh ganggu baris lain
    };
  });
  if (!tasks.length) return;
  if (typeof _pmRunPool === 'function') _pmRunPool(tasks, 6);
  else tasks.forEach(function(t){ t(); });
}

/* ── NOTIF TELEGRAM: status review/approval berubah ──
   Dikirim dari SINI (browser), bukan dari server -- project Firebase Review
   Approval Dashboard bukan milik kita, tidak ada akses Console untuk pasang
   Cloud Function di sana. Baca status Firestore-nya memang sudah terjadi di
   browser lewat historyUpgradeStatusBadges() di atas, jadi notif Telegram
   ditumpangkan di titik yang sama.
   Konsekuensi: notif baru terkirim kalau ADA yang membuka history.html
   (bukan real-time begitu di-approve). Kolom ra_notified_status (pm_records,
   Supabase) menyimpan status terakhir yang SUDAH terkirim, supaya status
   yang sama tidak dikirim ulang tiap kali halaman ini dibuka/refresh oleh
   siapa pun. Ditandai terkirim HANYA setelah fetch ke Telegram beneran
   sukses -- kalau gagal (jaringan putus dsb), percobaan berikutnya (buka
   history.html lagi) akan otomatis coba kirim ulang. */
var RA_TELEGRAM_TOKEN = '8949780246:AAFfdyPPRzS6kyrzjxbTQlWWOWeyXZ2oLGw';
var RA_TELEGRAM_CHAT_ID = '-5307120643';
var RA_NOTIF_LABELS = {
  reviewed: '📝 Direview',
  approved: '✅ Disetujui',
  returned_to_technician: '↩️ Dikembalikan ke Teknisi'
};

function raSendTelegramNotif(r, appr) {
  var label = RA_NOTIF_LABELS[appr.status];
  if (!label) return; // status lain (mis. balik ke 'submitted') -- tidak perlu notif
  var pesan = label + '\n' +
    'Modul: ' + (r.modul || '-') + '\n' +
    'PIC: ' + (r.pic || '-') + '\n' +
    'WO: ' + (r.work_order || '-');
  fetch('https://api.telegram.org/bot' + RA_TELEGRAM_TOKEN + '/sendMessage', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: RA_TELEGRAM_CHAT_ID, text: pesan })
  }).then(function() {
    return supaFetch('PATCH', SUPA_TABLE + '?id=eq.' + r.id, { ra_notified_status: appr.status });
  }).catch(function(err) {
    console.error('Gagal kirim notif Telegram review/approval:', err);
  });
}
/* 4 tahap: Draft (kuning, historyStatusBadge) -> Submitted (biru) ->
   Reviewed (kuning) -> Approved (hijau). "returned_to_technician" bukan
   salah satu dari 4 tahap itu (laporan dikembalikan, bukan maju ke tahap
   berikutnya) -- tetap ditandai terpisah (merah) supaya tidak disangka
   masih di tahap Reviewed biasa. */
function historyRaStatusBadge(raStatus) {
  var map = {
    submitted: { label: 'Submitted', bg: '#dbeafe', fg: '#1e40af' },
    reviewed: { label: 'Reviewed', bg: '#fef3c7', fg: '#92400e' },
    approved: { label: 'Approved', bg: '#dcfce7', fg: '#166534' },
    returned_to_technician: { label: '↩ Dikembalikan ke Teknisi', bg: '#fee2e2', fg: '#991b1b' }
  };
  var s = map[raStatus] || { label: 'Submitted', bg: '#dbeafe', fg: '#1e40af' };
  return '<span style="display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:700;background:'+s.bg+';color:'+s.fg+'" title="Status sungguhan dari Review Approval Dashboard.">'+s.label+'</span>';
}

function historyDelete(id) {
  if (!confirm('Hapus data ini?')) return;
  supaFetch('DELETE', SUPA_TABLE + '?id=eq.' + id)
    .then(function() {
      dbShowToast('Data berhasil dihapus');
      setTimeout(function(){ loadHistory(''); }, 500);
    })
    .catch(function(err){ alert('Gagal hapus: ' + (err.message||err)); });
}

/* ── SUBMIT LANGSUNG DARI RIWAYAT (tab biasa, bukan iframe tersembunyi) ──
   Versi awal fitur ini pakai iframe TERSEMBUNYI (display:none) supaya
   usernya tidak perlu lihat halaman modulnya sama sekali. Ternyata itu
   JADI MASALAH di HP: browser mobile (terutama Chrome Android) membatasi/
   menunda aktivitas jaringan di iframe/tab yang TIDAK TERLIHAT untuk hemat
   baterai -- akibatnya upload PDF ke Review Approval Dashboard bisa
   nyangkut TANPA PERNAH selesai (sukses maupun gagal) selama iframe-nya
   tersembunyi, bahkan dengan timeout sekalipun (timeout-nya sendiri bisa
   ikut tertunda kalau tab/iframe sedang di-throttle browser).
   Sekarang pakai window.open() -- tab BIASA yang kelihatan -- supaya
   prosesnya jalan di tab yang aktif/foreground, tidak kena pembatasan itu.
   Tab itu otomatis menutup diri sendiri begitu selesai (lihat autoclose=1
   di raSubmitReportAuto(), shared.js), jadi user tetap tidak perlu
   menutup manual, cuma akan melihat sekilas tab itu terbuka lalu tertutup
   sendiri. Modul yang sudah selesai (sukses/gagal) lapor balik lewat
   postMessage ke window.opener, ditangkap oleh listener di bawah -- BARU
   setelah PDF-nya benar-benar tuntas dikirim, bukan begitu status Supabase
   ke-update. Timeout di bawah cuma jaring pengaman kalau modulnya
   benar-benar macet total -- KALAU kena timeout ATAU tabnya ditutup
   usernya sebelum selesai, laporan TIDAK hilang: statusnya sudah SUBMITTED
   di Supabase, dan raRetryPendingFirebaseSyncs() (shared.js, lewat iframe
   tersembunyi sebagai best-effort) akan tetap otomatis mencoba mengirim
   ulang di kunjungan berikutnya. */
var _histSubmitJobs = {}; // id -> {popup, btn, timeoutId}

function historySubmit(id, modul) {
  if (_histSubmitJobs[id]) return; // sudah ada proses submit berjalan buat id ini
  if (!confirm('Yakin submit laporan ini ke Review Approval Dashboard?\n\nSebuah tab baru akan terbuka sebentar untuk memprosesnya, lalu tertutup otomatis.')) return;
  var url = modulToUrl(modul, id);
  if (!url || url === 'index.html') { alert('Modul tidak dikenali, tidak bisa disubmit dari sini.'); return; }
  var btn = document.getElementById('histSubmitBtn-' + id);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Sedang mensubmit...'; btn.style.opacity = '0.75'; }

  var popup = window.open(url + '&autosubmit=1&autoclose=1', '_blank');
  if (!popup) {
    alert('Tab baru diblokir browser (popup blocker). Izinkan pop-up untuk situs ini, lalu coba Resubmit lagi.');
    if (btn) { btn.disabled = false; btn.textContent = '🔁 Resubmit'; btn.style.opacity = '1'; }
    return;
  }

  // 4 menit -- HARUS lebih besar dari total timeout internal di
  // raSendFinalPdfToFirebaseDashboard (shared.js: 30 detik simpan + 3
  // menit upload PDF = 3.5 menit), supaya laporan besar/banyak foto (mis.
  // Coal Feeder + 4000 Hours Mill) sempat dapat pesan error yang jelas dari
  // sana duluan, bukan keburu dianggap "timeout" di sini padahal masih
  // benar-benar berjalan.
  var timeoutId = setTimeout(function(){
    historySubmitDone(id, false, 'Belum selesai dalam 4 menit -- kemungkinan koneksi lambat (banyak foto). Laporan TETAP tersubmit, akan otomatis dicoba lagi di latar belakang.');
  }, 240000);

  _histSubmitJobs[id] = { popup: popup, btn: btn, timeoutId: timeoutId };
}

function historySubmitDone(id, ok, err) {
  var job = _histSubmitJobs[id];
  if (!job) return; // sudah ditangani sebelumnya (mis. timeout duluan lalu pesan asli nyusul)
  delete _histSubmitJobs[id];
  clearTimeout(job.timeoutId);
  try { if (job.popup && !job.popup.closed) job.popup.close(); } catch (e) {} // jaga-jaga kalau autoclose di sisi tab gagal

  if (ok) {
    if (job.btn) {
      job.btn.disabled = true;
      job.btn.textContent = '✓ Tersubmit';
      job.btn.style.background = 'var(--ok)';
      job.btn.style.opacity = '1';
    }
    dbShowToast('✓ Laporan berhasil disubmit ke Review Approval Dashboard');
  } else {
    // Bisa dua hal: (a) status Supabase gagal ke-update sama sekali (jarang,
    // biasanya jaringan putus di awal) -- tombol Submit akan muncul lagi
    // setelah reload di bawah karena statusnya masih DRAFT, atau (b) status
    // sudah SUBMITTED tapi kirim PDF-nya belum tuntas -- setelah reload,
    // badge "⏳ Menyusul" muncul dan raRetryPendingFirebaseSyncs() yang
    // melanjutkan otomatis. Tidak perlu dibedakan di sini -- reload di bawah
    // akan menampilkan status yang sebenarnya.
    dbShowToast('⏳ ' + (err || 'Belum selesai, akan dicoba lagi otomatis di latar belakang.'));
  }
  setTimeout(function(){ loadHistory(''); }, 800); // refresh badge status/dashboard sesuai kondisi sebenarnya
}

window.addEventListener('message', function(e) {
  if (!e.data || e.data.type !== 'raAutosubmitDone') return;
  historySubmitDone(e.data.id, !!e.data.ok, e.data.error);
});

/* Auto-load all on open */
loadHistory('');
</script>
</body>
