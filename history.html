<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History / Riwayat - PM Instrument</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/shared.js"></script>
</head>
<body>
  <div class="container">
    <nav>
      <a href="index.html">← Dashboard</a>
      <span style="font-weight:600">📋 Riwayat / History</span>
    </nav>

    <div style="background:linear-gradient(135deg, #2c3e50 0%, #34495e 100%); color:#fff; padding:15px; border-radius:6px; margin-bottom:15px">
      <h2 style="margin:0 0 5px 0">Riwayat PM Inspection</h2>
      <p style="margin:0; font-size:12px; opacity:0.9">Lihat, edit, atau hapus record PM</p>
    </div>

    <div style="margin-bottom:15px; display:grid; grid-template-columns:1fr 1fr; gap:10px">
      <div>
        <label style="display:block; font-size:12px; font-weight:600; margin-bottom:4px">Filter by Module</label>
        <select id="filterModule" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:4px" onchange="loadHistory()">
          <option value="">Semua Module</option>
          <option value="FEGT">FEGT</option>
          <option value="SO2">SO2</option>
          <option value="OPACITY">Opacity</option>
          <option value="BELT_E45">Belt E4/E5</option>
          <option value="BELT_E23">Belt E2/E3</option>
          <option value="BELT_B12">Belt B1/B2</option>
        </select>
      </div>
      <div>
        <label style="display:block; font-size:12px; font-weight:600; margin-bottom:4px">Search by PIC</label>
        <input type="text" id="searchPIC" placeholder="Cari PIC..." style="width:100%; padding:8px; border:1px solid var(--border); border-radius:4px" onkeyup="loadHistory()">
      </div>
    </div>

    <div style="overflow-x:auto">
      <table id="historyTable">
        <thead>
          <tr style="background:#f8f9fa">
            <th>Tanggal</th>
            <th>Module</th>
            <th>PIC</th>
            <th>Work Order</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <tr><td colspan="6" style="text-align:center;padding:20px">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div id="dbStatusMsg" style="margin-top:10px; font-size:12px; color:#27ae60; text-align:center"></div>
  </div>

  <!-- Modal Preview -->
  <div id="previewModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:16px">
    <div style="background:var(--bg);border-radius:8px;padding:20px;max-width:90vw;max-height:90vh;overflow:auto;position:relative">
      <button onclick="closePreview()" style="position:absolute;top:10px;right:10px;background:var(--fail);color:#fff;border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:16px">×</button>
      <div id="previewContent"></div>
    </div>
  </div>

  <script>
    var allRecords = [];

    function loadHistory() {
      var module = document.getElementById('filterModule').value;
      var pic = document.getElementById('searchPIC').value.toLowerCase();
      
      dbList(module || '', function(rows) {
        allRecords = rows;
        renderHistory(rows, pic);
      });
    }

    function renderHistory(rows, picFilter) {
      var tbody = document.getElementById('historyBody');
      tbody.innerHTML = '';
      
      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text3)">Tidak ada data</td></tr>';
        return;
      }

      rows.forEach(function(rec) {
        if (picFilter && rec.pic.toLowerCase().indexOf(picFilter) === -1) return;
        
        var tr = document.createElement('tr');
        var modul = normalizeModul(rec.modul);
        var modulName = rec.modul;
        
        tr.innerHTML = 
          '<td style="font-size:11px">' + (rec.tanggal || '-') + '</td>'+
          '<td style="font-size:11px"><strong>' + modulName + '</strong></td>'+
          '<td style="font-size:11px">' + (rec.pic || '-') + '</td>'+
          '<td style="font-size:11px">' + (rec.work_order || '-') + '</td>'+
          '<td style="font-size:11px"><span style="background:#e8f5ee;color:#27ae60;padding:2px 6px;border-radius:3px">Tersimpan</span></td>'+
          '<td style="font-size:11px">'+
            '<button onclick="openRecord(\'' + rec.id + '\')" style="background:var(--ok);color:#fff;border:none;padding:4px 8px;border-radius:3px;cursor:pointer;margin-right:4px">Edit</button>'+
            '<button onclick="deleteRecord(\'' + rec.id + '\')" style="background:var(--fail);color:#fff;border:none;padding:4px 8px;border-radius:3px;cursor:pointer">Hapus</button>'+
          '</td>';
        tbody.appendChild(tr);
      });
    }

    function openRecord(id) {
      var rec = allRecords.find(r => r.id === id);
      if (!rec) return;
      
      var modul = normalizeModul(rec.modul);
      var url = '';
      
      if (modul === 'FEGT') url = 'fegt.html';
      else if (modul === 'SO2') url = 'so2.html';
      else if (modul === 'OPACITY') url = 'opacity.html';
      else if (modul === 'BELT_E45') url = 'belt-scale-e45.html';
      else if (modul === 'BELT_E23') url = 'belt-scale-e23.html';
      else if (modul === 'BELT_B12') url = 'belt-scale-b12.html';
      
      if (url) {
        window.location.href = url + '?id=' + id;
      } else {
        alert('Module tidak dikenali: ' + rec.modul);
      }
    }

    function deleteRecord(id) {
      if (!confirm('Yakin ingin menghapus record ini?')) return;
      dbDelete(id);
    }

    function closePreview() {
      document.getElementById('previewModal').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadHistory();
    });
  </script>
</body>
</html>
