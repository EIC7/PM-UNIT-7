<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opacity Monitor - PM Instrument</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/shared.js"></script>
</head>
<body>
  <div class="container">
    <nav>
      <a href="index.html">← Dashboard</a>
      <span style="font-weight:600">👁️ Opacity Monitor</span>
    </nav>

    <form id="opForm">
      <div style="background:linear-gradient(135deg, #2c3e50 0%, #34495e 100%); color:#fff; padding:15px; border-radius:6px; margin-bottom:15px">
        <h2 style="margin:0 0 5px 0">Opacity Monitor Inspection</h2>
        <p style="margin:0; font-size:12px; opacity:0.9">Field 7A & 7B Monitoring & Photo Documentation</p>
      </div>

      <div class="form-group">
        <label>Tanggal Inspeksi</label>
        <input type="date" id="opDate">
      </div>

      <div class="form-group">
        <label>PIC (Person in Charge)</label>
        <input type="text" id="opPIC" placeholder="Nama operator">
      </div>

      <div class="form-group">
        <label>Work Order</label>
        <input type="text" id="opWO" placeholder="e.g. WO-001">
      </div>

      <!-- Field 7A -->
      <div style="background:#f8f9fa; padding:15px; border-radius:6px; margin-bottom:15px">
        <h3>🔍 Field 7A Monitoring</h3>
        
        <div class="form-group">
          <label>Opacity Reading 7A (%)</label>
          <input type="number" id="op7A_Reading" min="0" max="100" step="0.1" placeholder="0-100">
        </div>

        <div class="form-group">
          <label>Status</label>
          <select id="op7A_Status" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:4px">
            <option value="">-- Pilih Status --</option>
            <option value="Normal">✓ Normal</option>
            <option value="Warning">⚠ Warning</option>
            <option value="Alert">🔴 Alert</option>
          </select>
        </div>

        <div class="form-group">
          <label>Cleaning Status 7A</label>
          <div>
            <input type="checkbox" id="op7A_Cleaned"> <label for="op7A_Cleaned" style="display:inline; margin:0">Lens/Mirror dibersihkan</label>
          </div>
        </div>

        <div class="form-group">
          <label>Catatan Field 7A</label>
          <textarea id="op7A_Notes" placeholder="Catatan kondisi, perbaikan, dll"></textarea>
        </div>

        <div style="margin-bottom:15px">
          <label>📷 Field 7A Photos</label>
          <div class="image-upload" id="opImgDrop7A" style="cursor:pointer; border:2px dashed var(--border); padding:20px; border-radius:6px">
            <div style="font-size:28px">📸</div>
            <div>Click atau drag file untuk upload</div>
          </div>
          <input type="file" id="opImgInput7A" accept="image/*" multiple style="display:none" onchange="opHandleFiles(this.files,'7A')">
          <div id="opImgPreview7A" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"></div>
        </div>
      </div>

      <!-- Field 7B -->
      <div style="background:#f8f9fa; padding:15px; border-radius:6px; margin-bottom:15px">
        <h3>🔍 Field 7B Monitoring</h3>
        
        <div class="form-group">
          <label>Opacity Reading 7B (%)</label>
          <input type="number" id="op7B_Reading" min="0" max="100" step="0.1" placeholder="0-100">
        </div>

        <div class="form-group">
          <label>Status</label>
          <select id="op7B_Status" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:4px">
            <option value="">-- Pilih Status --</option>
            <option value="Normal">✓ Normal</option>
            <option value="Warning">⚠ Warning</option>
            <option value="Alert">🔴 Alert</option>
          </select>
        </div>

        <div class="form-group">
          <label>Cleaning Status 7B</label>
          <div>
            <input type="checkbox" id="op7B_Cleaned"> <label for="op7B_Cleaned" style="display:inline; margin:0">Lens/Mirror dibersihkan</label>
          </div>
        </div>

        <div class="form-group">
          <label>Catatan Field 7B</label>
          <textarea id="op7B_Notes" placeholder="Catatan kondisi, perbaikan, dll"></textarea>
        </div>

        <div style="margin-bottom:15px">
          <label>📷 Field 7B Photos</label>
          <div class="image-upload" id="opImgDrop7B" style="cursor:pointer; border:2px dashed var(--border); padding:20px; border-radius:6px">
            <div style="font-size:28px">📸</div>
            <div>Click atau drag file untuk upload</div>
          </div>
          <input type="file" id="opImgInput7B" accept="image/*" multiple style="display:none" onchange="opHandleFiles(this.files,'7B')">
          <div id="opImgPreview7B" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"></div>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px">
        <button type="submit" class="btn btn-primary" onclick="opSave(event)">💾 Simpan ke Database</button>
        <button type="button" class="btn btn-secondary" onclick="opReset()">✕ Reset</button>
      </div>

      <button type="button" class="btn btn-primary" style="width:100%" onclick="opDownloadPdf()">🖨️ Download PDF</button>
      <div id="dbStatusMsgOp" style="margin-top:10px; font-size:12px; color:#27ae60"></div>
    </form>
  </div>

  <script>
    var opImages = {'7A':[], '7B':[]};
    var OP_CHECKS = window.OP_CHECKS || [];

    function initPage() {
      setupDragDrop('opImgDrop7A', 'opImgInput7A', '7A');
      setupDragDrop('opImgDrop7B', 'opImgInput7B', '7B');

      var el = document.getElementById('opDate');
      if (!el.value) {
        var t = new Date();
        el.value = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
      }

      var urlParams = new URLSearchParams(window.location.search);
      var recordId = urlParams.get('id');
      if (recordId) {
        dbLoad(recordId, function(rec) {
          if (!rec) return;
          setVal('opDate', rec.tanggal || '');
          setVal('opPIC', rec.pic || '');
          setVal('opWO', rec.work_order || '');
          var data = rec.data || {};
          
          if (data.readings) {
            setVal('op7A_Reading', data.readings['7A'] || '');
            setVal('op7B_Reading', data.readings['7B'] || '');
          }
          if (data.status) {
            document.getElementById('op7A_Status').value = data.status['7A'] || '';
            document.getElementById('op7B_Status').value = data.status['7B'] || '';
          }
          if (data.cleaned) {
            setChk('op7A_Cleaned', data.cleaned['7A']);
            setChk('op7B_Cleaned', data.cleaned['7B']);
          }
          if (data.notes) {
            document.getElementById('op7A_Notes').value = data.notes['7A'] || '';
            document.getElementById('op7B_Notes').value = data.notes['7B'] || '';
          }
          
          if (data.images) {
            opImages['7A'] = (data.images['7A'] || []).map(function(img) {
              return {name: img.name, dataUrl: img.dataUrl, type: img.type || 'image/jpeg'};
            });
            opImages['7B'] = (data.images['7B'] || []).map(function(img) {
              return {name: img.name, dataUrl: img.dataUrl, type: img.type || 'image/jpeg'};
            });
            opRenderPreviews('7A');
            opRenderPreviews('7B');
          }
        });
      }
    }

    function setupDragDrop(dropId, inputId, side) {
      var dropEl = document.getElementById(dropId);
      var inputEl = document.getElementById(inputId);
      dropEl.addEventListener('click', function() { inputEl.click(); });
      dropEl.addEventListener('dragover', function(e) { e.preventDefault(); this.style.borderColor = '#27ae60'; });
      dropEl.addEventListener('dragleave', function() { this.style.borderColor = 'var(--border)'; });
      dropEl.addEventListener('drop', function(e) { e.preventDefault(); this.style.borderColor = 'var(--border)'; opHandleFiles(e.dataTransfer.files, side); });
    }

    function opHandleFiles(files, side) {
      Array.from(files).forEach(function(file) {
        if (!isImageFile(file)) return;
        fileToJpegDataUrl(file, function(dataUrl) {
          if (!dataUrl) return;
          var name = file.name.replace(/\.[^.]+$/, '.jpg');
          var img = new Image();
          img.onload = function() {
            var c = document.createElement('canvas');
            c.width = img.width; c.height = img.height;
            c.getContext('2d').drawImage(img, 0, 0);
            opCompressAndStore(c, name, opImages[side], side);
          };
          img.src = dataUrl;
        });
      });
    }

    function opRenderPreviews(side) {
      var container = document.getElementById('opImgPreview'+side);
      if (!container) return;
      container.innerHTML = '';
      var imgs = opImages[side] || [];
      imgs.forEach(function(f, idx) {
        var wrap = document.createElement('div');
        wrap.style.cssText = 'position:relative;display:inline-block;text-align:center;margin:4px';
        var thumb = '<img src="'+f.dataUrl+'" style="width:80px;height:64px;object-fit:cover;border-radius:4px;border:2px solid var(--ok);display:block;cursor:pointer" onclick="opOpenImg(this.src)">';
        wrap.innerHTML = thumb + '<button onclick="opRemoveImg('+side.charCodeAt(0)+','+idx+')" style="position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:50%;background:var(--fail);color:#fff;border:none;cursor:pointer;font-size:10px">×</button><div style="font-size:9px;color:var(--text3);margin-top:2px;max-width:80px;overflow:hidden;white-space:nowrap">'+f.name+'</div>';
        container.appendChild(wrap);
      });
    }

    function opRemoveImg(code, idx) {
      var side = String.fromCharCode(code);
      opImages[side].splice(idx, 1);
      opRenderPreviews(side);
    }

    function opOpenImg(src) {
      window.open(src, '_blank');
    }

    function opCompressAndStore(canvas, name, imgArr, side) {
      var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      var entry = {name: name, dataUrl: dataUrl, type: 'image/jpeg'};
      imgArr.push(entry);
      opRenderPreviews(side);
    }

    function opSave(e) {
      e.preventDefault();
      var readings = {
        '7A': getVal('op7A_Reading') || '',
        '7B': getVal('op7B_Reading') || ''
      };
      var status = {
        '7A': document.getElementById('op7A_Status').value || '',
        '7B': document.getElementById('op7B_Status').value || ''
      };
      var cleaned = {
        '7A': document.getElementById('op7A_Cleaned').checked,
        '7B': document.getElementById('op7B_Cleaned').checked
      };
      var notes = {
        '7A': document.getElementById('op7A_Notes').value || '',
        '7B': document.getElementById('op7B_Notes').value || ''
      };
      var images = {
        '7A': opImages['7A'].map(function(img) {
          var b64 = img.dataUrl || '';
          if (b64.length > 100) {
            var maxChars = Math.floor(40000 * 1.33);
            var truncated = b64.substring(0, maxChars);
            truncated = truncated.substring(0, truncated.length - (truncated.length % 4));
            return {name: img.name, dataUrl: truncated, type: img.type || 'image/jpeg'};
          }
          return {name: img.name, dataUrl: b64, type: img.type || 'image/jpeg'};
        }),
        '7B': opImages['7B'].map(function(img) {
          var b64 = img.dataUrl || '';
          if (b64.length > 100) {
            var maxChars = Math.floor(40000 * 1.33);
            var truncated = b64.substring(0, maxChars);
            truncated = truncated.substring(0, truncated.length - (truncated.length % 4));
            return {name: img.name, dataUrl: truncated, type: img.type || 'image/jpeg'};
          }
          return {name: img.name, dataUrl: b64, type: img.type || 'image/jpeg'};
        })
      };
      var data = {readings: readings, status: status, cleaned: cleaned, notes: notes, images: images};
      dbSave('OPACITY', getVal('opDate'), getVal('opPIC'), getVal('opWO'), UNIT, data, null, function(id) {
        var el = document.getElementById('dbStatusMsgOp');
        if(el) { el.textContent = 'Tersimpan ✓'; el.style.color = '#27ae60'; setTimeout(function(){el.textContent='';}, 3000); }
      });
    }

    function opReset() {
      if (!confirm('Yakin ingin reset semua data?')) return;
      opImages = {'7A':[], '7B':[]};
      ['opDate','opPIC','opWO','op7A_Reading','op7B_Reading','op7A_Notes','op7B_Notes'].forEach(function(id){ var e = document.getElementById(id); if(e) e.value = ''; });
      ['op7A_Status','op7B_Status'].forEach(function(id){ document.getElementById(id).value = ''; });
      ['op7A_Cleaned','op7B_Cleaned'].forEach(function(id){ document.getElementById(id).checked = false; });
      opRenderPreviews('7A');
      opRenderPreviews('7B');
    }

    function opDownloadPdf() {
      try {
        var jsPDF = window.jspdf.jsPDF;
        var doc = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
        var pw = doc.internal.pageSize.getWidth();
        var now = new Date();
        var BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
        var dd=String(now.getDate()).padStart(2,'0'),mmN=BULAN[now.getMonth()],yy=now.getFullYear();
        doc.setFillColor(44,62,48);
        doc.rect(0,0,pw,20,'F');
        doc.setFont('helvetica','bold');
        doc.setFontSize(14);
        doc.setTextColor(210,230,215);
        doc.text('OPACITY MONITOR INSPECTION',pw/2,10,{align:'center'});
        doc.setFont('helvetica','normal');
        doc.setFontSize(8);
        doc.setTextColor(140,185,155);
        doc.text('PT POMI - PLTU Paiton Unit 7',pw/2,16,{align:'center'});
        var y = 28;
        doc.setTextColor(44,62,48);
        doc.setFontSize(9);
        doc.setFont('helvetica','bold');
        doc.text('Data Inspeksi:',10,y);
        y += 4;
        doc.setFont('helvetica','normal');
        doc.setFontSize(8);
        doc.text('Tanggal: ' + (getVal('opDate')||'-'), 10, y);
        y += 4;
        doc.text('PIC: ' + (getVal('opPIC')||'-'), 10, y);
        y += 4;
        doc.text('Work Order: ' + (getVal('opWO')||'-'), 10, y);
        y += 6;
        doc.setFont('helvetica','bold');
        doc.setFontSize(10);
        doc.text('Field 7A: ' + (getVal('op7A_Reading')||'-') + '%', 10, y);
        y += 5;
        if (opImages['7A'].length > 0) {
          opImages['7A'].forEach(function(img) { if (img.dataUrl && y < 270) { doc.addImage(img.dataUrl, 'JPEG', 10, y, 40, 30); y += 35; } });
        }
        y += 5;
        doc.setFont('helvetica','bold');
        doc.setFontSize(10);
        doc.text('Field 7B: ' + (getVal('op7B_Reading')||'-') + '%', 10, y);
        y += 5;
        if (opImages['7B'].length > 0) {
          opImages['7B'].forEach(function(img) { if (img.dataUrl && y < 270) { doc.addImage(img.dataUrl, 'JPEG', 10, y, 40, 30); y += 35; } });
        }
        doc.save('Opacity-Inspection-' + dd + mmN + yy + '.pdf');
      } catch(e) {
        alert('Error: ' + e.message);
      }
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
