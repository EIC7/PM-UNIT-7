<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FEGT Monitor - PM Instrument</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/shared.js"></script>
</head>
<body>
  <div class="container">
    <nav>
      <a href="index.html">← Dashboard</a>
      <span style="font-weight:600">🌡️ FEGT & Leak Detection</span>
    </nav>

    <form id="fegForm">
      <div style="background:linear-gradient(135deg, #2c3e50 0%, #34495e 100%); color:#fff; padding:15px; border-radius:6px; margin-bottom:15px">
        <h2 style="margin:0 0 5px 0">FEGT & Leak Detection</h2>
        <p style="margin:0; font-size:12px; opacity:0.9">Flue Gas Exit Temperature & Leak Detection Inspection</p>
      </div>

      <div class="form-group">
        <label>Tanggal Inspeksi</label>
        <input type="date" id="fegDate">
      </div>

      <div class="form-group">
        <label>PIC (Person in Charge)</label>
        <input type="text" id="fegPIC" placeholder="Nama operator">
      </div>

      <div class="form-group">
        <label>Work Order</label>
        <input type="text" id="fegWO" placeholder="e.g. WO-001">
      </div>

      <!-- FEGT Temperature Readings -->
      <div style="background:#f8f9fa; padding:15px; border-radius:6px; margin-bottom:15px">
        <h3>🌡️ FEGT Temperature Readings</h3>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div class="form-group">
            <label>Inlet Temperature (°C)</label>
            <input type="number" id="fegInlet" min="0" max="300" step="0.1" placeholder="e.g. 165">
          </div>
          <div class="form-group">
            <label>Outlet Temperature (°C)</label>
            <input type="number" id="fegOutlet" min="0" max="300" step="0.1" placeholder="e.g. 145">
          </div>
        </div>

        <div class="form-group">
          <label>Catatan Suhu</label>
          <textarea id="fegTempNotes" placeholder="Catatan mengenai pembacaan suhu..."></textarea>
        </div>
      </div>

      <!-- Leak Detection -->
      <div style="background:#f8f9fa; padding:15px; border-radius:6px; margin-bottom:15px">
        <h3>🔍 Leak Detection</h3>
        
        <div style="display:grid;gap:10px">
          <div>
            <label style="display:flex;align-items:center;gap:8px">
              <input type="checkbox" id="fegLeakVisual" style="width:16px;height:16px;accent-color:var(--ok)">
              <span>Visual Inspection: Tidak ada kebocoran</span>
            </label>
          </div>
          <div>
            <label style="display:flex;align-items:center;gap:8px">
              <input type="checkbox" id="fegLeakHearing" style="width:16px;height:16px;accent-color:var(--ok)">
              <span>Hearing Test: Tidak ada suara aneh</span>
            </label>
          </div>
          <div>
            <label style="display:flex;align-items:center;gap:8px">
              <input type="checkbox" id="fegLeakVibration" style="width:16px;height:16px;accent-color:var(--ok)">
              <span>Vibration Check: Getaran normal</span>
            </label>
          </div>
        </div>

        <div class="form-group" style="margin-top:10px">
          <label>Catatan Kebocoran / Anomali</label>
          <textarea id="fegLeakNotes" placeholder="Jika ada kebocoran atau masalah, jelaskan di sini..."></textarea>
        </div>
      </div>

      <!-- Maintenance -->
      <div style="background:#f8f9fa; padding:15px; border-radius:6px; margin-bottom:15px">
        <h3>🔧 Maintenance Actions</h3>
        
        <div style="display:grid;gap:10px">
          <div>
            <label style="display:flex;align-items:center;gap:8px">
              <input type="checkbox" id="fegMaintClean" style="width:16px;height:16px;accent-color:var(--ok)">
              <span>Cleaning: Piping & connections dibersihkan</span>
            </label>
          </div>
          <div>
            <label style="display:flex;align-items:center;gap:8px">
              <input type="checkbox" id="fegMaintLube" style="width:16px;height:16px;accent-color:var(--ok)">
              <span>Lubrication: Bearing & joints dilumasi</span>
            </label>
          </div>
          <div>
            <label style="display:flex;align-items:center;gap:8px">
              <input type="checkbox" id="fegMaintTighten" style="width:16px;height:16px;accent-color:var(--ok)">
              <span>Tightening: Semua connection dikencangkan</span>
            </label>
          </div>
        </div>

        <div class="form-group" style="margin-top:10px">
          <label>Catatan Maintenance</label>
          <textarea id="fegMaintNotes" placeholder="Perbaikan atau perubahan yang dilakukan..."></textarea>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px">
        <button type="submit" class="btn btn-primary" onclick="fegSave(event)">💾 Simpan ke Database</button>
        <button type="button" class="btn btn-secondary" onclick="fegReset()">✕ Reset</button>
      </div>

      <button type="button" class="btn btn-primary" style="width:100%" onclick="fegDownloadPdf()">🖨️ Download PDF</button>
      <div id="dbStatusMsgFeg" style="margin-top:10px; font-size:12px; color:#27ae60"></div>
    </form>
  </div>

  <script>
    function initPage() {
      var el = document.getElementById('fegDate');
      if (!el.value) {
        var t = new Date();
        el.value = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
      }

      var urlParams = new URLSearchParams(window.location.search);
      var recordId = urlParams.get('id');
      if (recordId) {
        dbLoad(recordId, function(rec) {
          if (!rec) return;
          setVal('fegDate', rec.tanggal || '');
          setVal('fegPIC', rec.pic || '');
          setVal('fegWO', rec.work_order || '');
          var data = rec.data || {};
          
          if (data.temperatures) {
            setVal('fegInlet', data.temperatures.inlet || '');
            setVal('fegOutlet', data.temperatures.outlet || '');
            document.getElementById('fegTempNotes').value = data.temperatures.notes || '';
          }
          if (data.leak) {
            setChk('fegLeakVisual', data.leak.visual);
            setChk('fegLeakHearing', data.leak.hearing);
            setChk('fegLeakVibration', data.leak.vibration);
            document.getElementById('fegLeakNotes').value = data.leak.notes || '';
          }
          if (data.maintenance) {
            setChk('fegMaintClean', data.maintenance.clean);
            setChk('fegMaintLube', data.maintenance.lube);
            setChk('fegMaintTighten', data.maintenance.tighten);
            document.getElementById('fegMaintNotes').value = data.maintenance.notes || '';
          }
        });
      }
    }

    function fegSave(e) {
      e.preventDefault();
      var data = {
        temperatures: {
          inlet: getVal('fegInlet') || '',
          outlet: getVal('fegOutlet') || '',
          notes: document.getElementById('fegTempNotes').value || ''
        },
        leak: {
          visual: document.getElementById('fegLeakVisual').checked,
          hearing: document.getElementById('fegLeakHearing').checked,
          vibration: document.getElementById('fegLeakVibration').checked,
          notes: document.getElementById('fegLeakNotes').value || ''
        },
        maintenance: {
          clean: document.getElementById('fegMaintClean').checked,
          lube: document.getElementById('fegMaintLube').checked,
          tighten: document.getElementById('fegMaintTighten').checked,
          notes: document.getElementById('fegMaintNotes').value || ''
        }
      };
      dbSave('FEGT', getVal('fegDate'), getVal('fegPIC'), getVal('fegWO'), UNIT, data, null, function(id) {
        var el = document.getElementById('dbStatusMsgFeg');
        if(el) { el.textContent = 'Tersimpan ✓'; el.style.color = '#27ae60'; setTimeout(function(){el.textContent='';}, 3000); }
      });
    }

    function fegReset() {
      if (!confirm('Yakin ingin reset semua data?')) return;
      ['fegDate','fegPIC','fegWO','fegInlet','fegOutlet','fegTempNotes','fegLeakNotes','fegMaintNotes'].forEach(function(id){ var e = document.getElementById(id); if(e) e.value = ''; });
      ['fegLeakVisual','fegLeakHearing','fegLeakVibration','fegMaintClean','fegMaintLube','fegMaintTighten'].forEach(function(id){ document.getElementById(id).checked = false; });
    }

    function fegDownloadPdf() {
      try {
        var jsPDF = window.jspdf.jsPDF;
        var doc = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
        var pw = doc.internal.pageSize.getWidth();
        doc.setFillColor(44,62,48);
        doc.rect(0,0,pw,20,'F');
        doc.setFont('helvetica','bold');
        doc.setFontSize(14);
        doc.setTextColor(210,230,215);
        doc.text('FEGT & LEAK DETECTION REPORT',pw/2,10,{align:'center'});
        doc.setFont('helvetica','normal');
        doc.setFontSize(8);
        doc.setTextColor(140,185,155);
        doc.text('PT POMI - PLTU Paiton Unit 7',pw/2,16,{align:'center'});
        var y = 28;
        doc.setTextColor(44,62,48);
        doc.setFontSize(9);
        doc.setFont('helvetica','bold');
        doc.text('Data Inspeksi:',10,y);
        y += 4;
        doc.setFont('helvetica','normal');
        doc.setFontSize(8);
        doc.text('Tanggal: ' + (getVal('fegDate')||'-'), 10, y);
        y += 4;
        doc.text('PIC: ' + (getVal('fegPIC')||'-'), 10, y);
        y += 4;
        doc.text('WO: ' + (getVal('fegWO')||'-'), 10, y);
        y += 6;
        doc.setFont('helvetica','bold');
        doc.text('FEGT Temperature:', 10, y);
        y += 4;
        doc.setFont('helvetica','normal');
        doc.text('  Inlet: ' + (getVal('fegInlet')||'-') + '°C', 10, y);
        y += 4;
        doc.text('  Outlet: ' + (getVal('fegOutlet')||'-') + '°C', 10, y);
        y += 4;
        doc.text('  Notes: ' + document.getElementById('fegTempNotes').value, 10, y);
        y += 8;
        doc.setFont('helvetica','bold');
        doc.text('Leak Detection:', 10, y);
        y += 4;
        doc.setFont('helvetica','normal');
        doc.text('  Visual: ' + (document.getElementById('fegLeakVisual').checked ? '✓' : '✗'), 10, y);
        y += 4;
        doc.text('  Hearing: ' + (document.getElementById('fegLeakHearing').checked ? '✓' : '✗'), 10, y);
        y += 4;
        doc.text('  Vibration: ' + (document.getElementById('fegLeakVibration').checked ? '✓' : '✗'), 10, y);
        doc.save('FEGT-Report-' + getVal('fegDate') + '.pdf');
      } catch(e) {
        alert('Error: ' + e.message);
      }
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
