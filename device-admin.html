<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Device Admin — Kelola Akses PM Unit 7</title>
<script src="shared.js"></script>
<style>
  :root{
    --bg:#f8fafb; --bg2:#ffffff; --bg3:#f3f4f6;
    --border:#e5e7eb; --text-dark:#1f2937; --text-mid:#4b5563; --text-light:#9ca3af;
    --green:#16a085; --red:#ef4444; --amber:#f59e0b;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.05); --shadow-md:0 4px 16px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text-dark)}
  header{background:var(--bg2);border-bottom:1px solid var(--border);padding:18px clamp(16px,4vw,40px);position:sticky;top:0;z-index:10}
  header h1{margin:0;font-size:18px;font-weight:800}
  header p{margin:4px 0 0;font-size:12.5px;color:var(--text-light)}
  main{max-width:1000px;margin:0 auto;padding:22px clamp(16px,4vw,40px) 60px}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar-info{font-size:12.5px;color:var(--text-light)}
  button.refresh{padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);font-size:12.5px;font-weight:600;color:var(--text-mid);cursor:pointer}
  button.refresh:hover{background:var(--bg3)}
  .device-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .device-main{flex:1;min-width:220px}
  .device-name{font-size:14.5px;font-weight:700;color:var(--text-dark)}
  .device-name .empty{color:var(--text-light);font-weight:400;font-style:italic}
  .device-meta{font-size:11.5px;color:var(--text-light);margin-top:3px;line-height:1.6}
  .device-meta code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:10.5px}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
  .badge.trusted{background:#e6f7f1;color:var(--green)}
  .badge.pending{background:#fff3e0;color:var(--amber)}
  .badge.online{background:#e8f5e9;color:#2e7d32}
  .actions{display:flex;gap:8px;flex-shrink:0}
  .btn{padding:8px 14px;border-radius:8px;border:none;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn.trust{background:var(--green);color:#fff}
  .btn.revoke{background:var(--bg3);color:var(--text-mid);border:1px solid var(--border)}
  .btn.del{background:#fdecea;color:var(--red)}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-light)}
  .empty-state .ic{font-size:36px;margin-bottom:10px}
  .loading{text-align:center;padding:40px;color:var(--text-light);font-size:13px}
</style>
</head>
<body>

<header>
  <h1>🔑 Device Admin</h1>
  <p>Kelola device yang boleh akses tanpa password (Trusted Device) — Unit 7 PLTU Paiton</p>
</header>

<main>
  <div class="toolbar">
    <div class="toolbar-info" id="daCount">Memuat data...</div>
    <div style="display:flex;gap:8px">
      <button class="refresh" onclick="daOpenAccountPanel()">👤 Kelola Akun</button>
      <button class="refresh" onclick="daLoadDevices()">↻ Refresh</button>
    </div>
  </div>
  <div id="daList"><div class="loading">Memuat daftar device...</div></div>
</main>

<script>

function daFmtDate(iso) {
  if (!iso) return '—';
  try {
    var d = new Date(iso);
    return d.toLocaleString('id-ID', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
  } catch(e) { return iso; }
}

function daParseUA(ua) {
  if (!ua) return 'Tidak diketahui';
  var os = 'OS?', browser = 'Browser?';
  if (/android/i.test(ua)) os = 'Android';
  else if (/iphone|ipad|ios/i.test(ua)) os = 'iOS';
  else if (/windows/i.test(ua)) os = 'Windows';
  else if (/mac os/i.test(ua)) os = 'macOS';
  else if (/linux/i.test(ua)) os = 'Linux';
  if (/edg\//i.test(ua)) browser = 'Edge';
  else if (/chrome\//i.test(ua)) browser = 'Chrome';
  else if (/firefox\//i.test(ua)) browser = 'Firefox';
  else if (/safari\//i.test(ua)) browser = 'Safari';
  return browser + ' · ' + os;
}

var _daRows = [];
var _daOnlineIds = {}; // diisi dari Presence (Realtime), BUKAN dari database -- lihat daSubscribePresence

function daLoadDevices() {
  var listEl = document.getElementById('daList');
  var countEl = document.getElementById('daCount');
  listEl.innerHTML = '<div class="loading">Memuat daftar device...</div>';
  supaFetch('GET', 'trusted_devices?order=last_seen.desc')
    .then(function(rows) {
      _daRows = rows;
      daRenderList();
    })
    .catch(function(err) {
      listEl.innerHTML = '<div class="empty-state"><div class="ic">⚠️</div>Gagal memuat data.<br>' + (err.message || err) + '<br><br>Pastikan tabel <code>trusted_devices</code> sudah dibuat di Supabase.</div>';
      countEl.textContent = '';
    });
}

function daRenderList() {
  var listEl = document.getElementById('daList');
  var countEl = document.getElementById('daCount');
  // _daRows sudah terurut last_seen.desc dari query awal, TAPI itu snapshot
  // histori (dan sekarang di-throttle resync tiap 30 menit di shared.js),
  // sedangkan status Online di sini adalah kondisi REAL-TIME (device beneran
  // connect ke channel Realtime SEKARANG). Device yang online pasti lebih
  // "baru aktif" daripada last_seen manapun, jadi ditampilkan duluan di atas
  // -- baru sisanya (yang offline) diurutkan last_seen seperti biasa.
  var rows = _daRows.slice().sort(function(a, b) {
    var aOnline = !!_daOnlineIds[a.device_id];
    var bOnline = !!_daOnlineIds[b.device_id];
    if (aOnline !== bOnline) return aOnline ? -1 : 1;
    return 0; // sama-sama online / sama-sama offline -> pertahankan urutan last_seen.desc dari _daRows
  });
  var onlineCount = Object.keys(_daOnlineIds).length;
  countEl.textContent = rows.length + ' device pernah tercatat' + (onlineCount ? ' · 🟢 ' + onlineCount + ' online sekarang' : '');
  if (!rows.length) {
    listEl.innerHTML = '<div class="empty-state"><div class="ic">📭</div>Belum ada device yang tercatat.<br>Device baru akan muncul di sini setelah user memasukkan password pertama kali.</div>';
    return;
  }
  listEl.innerHTML = rows.map(function(r) {
    var name = r.device_name ? r.device_name : '<span class="empty">(tanpa nama)</span>';
    var badge = r.trusted
      ? '<span class="badge trusted">✓ Trusted</span>'
      : '<span class="badge pending">⏳ Pending</span>';
    var onlineBadge = _daOnlineIds[r.device_id]
      ? ' <span class="badge online">🟢 Online</span>'
      : '';
    var actionBtn = r.trusted
      ? '<button class="btn revoke" onclick="daToggleTrust(\'' + r.device_id + '\', false)">Cabut Trusted</button>'
      : '<button class="btn trust" onclick="daToggleTrust(\'' + r.device_id + '\', true)">✓ Jadikan Trusted</button>';
    return '' +
      '<div class="device-card">' +
        '<div class="device-main">' +
          '<div class="device-name">' + name + ' ' + badge + onlineBadge + '</div>' +
          '<div class="device-meta">' +
            daParseUA(r.user_agent) + '<br>' +
            'Pertama akses: ' + daFmtDate(r.first_seen) + ' &nbsp;·&nbsp; Terakhir: ' + daFmtDate(r.last_seen) + '<br>' +
            '<code>' + r.device_id + '</code>' +
          '</div>' +
        '</div>' +
        '<div class="actions">' +
          actionBtn +
          '<button class="btn del" onclick="daDeleteDevice(\'' + r.device_id + '\')">Hapus</button>' +
        '</div>' +
      '</div>';
  }).join('');
}

/* ── KELOLA AKUN (bikin/update akun pm_profiles + auth.users) ──
   Reuse SISTEM LOGIN YANG SAMA dengan maintenance_report_form.html
   (raRequireLogin, dari shared.js) -- BUKAN gate device-admin (yang beda
   urusan, itu "device mana yang boleh buka aplikasi", bukan "akun siapa
   yang boleh submit/approve laporan"). Panel ini cuma tampil setelah
   login SEBAGAI ADMIN (role='admin' di pm_profiles), dan pemanggilan RPC
   pm_seed_account() di server JUGA mengecek ulang role admin secara
   independen (lihat sql/002_secure_pm_seed_account.sql) -- jadi walau
   panel ini di-bypass manual dari console, RPC-nya tetap menolak kalau
   bukan admin. */
function daOpenAccountPanel() {
  raRequireLogin(['admin'], 'Login Admin untuk Kelola Akun', function(profile) {
    daShowAccountModal(profile);
  });
}

function daShowAccountModal(profile) {
  var old = document.getElementById('daAcctModal');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  var wrap = document.createElement('div');
  wrap.id = 'daAcctModal';
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(15,20,18,0.6);z-index:2000000;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif';
  wrap.innerHTML =
    '<div style="background:#fff;border-radius:12px;padding:22px;width:min(94vw,380px);box-shadow:0 10px 40px rgba(0,0,0,0.35)">' +
      '<div style="font-weight:800;font-size:15px;margin-bottom:2px;color:#1f2937">👤 Kelola Akun</div>' +
      '<div style="font-size:12px;color:#6b7280;margin-bottom:14px">Login sebagai <b>' + (profile.display_name || profile.username) + '</b> (admin). Buat akun baru atau reset password akun yang sudah ada (username sama = update).</div>' +
      '<input id="daAcctUser" type="text" placeholder="Username (mis. checker3)" autocomplete="off" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px;font-size:14px">' +
      '<input id="daAcctPass" type="text" placeholder="Password (min. 6 karakter)" autocomplete="off" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px;font-size:14px">' +
      '<input id="daAcctName" type="text" placeholder="Nama tampilan (opsional)" autocomplete="off" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px;font-size:14px">' +
      '<select id="daAcctRole" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px;font-size:14px">' +
        '<option value="user">user (isi & submit laporan)</option>' +
        '<option value="checker">checker (periksa laporan)</option>' +
        '<option value="reviewer">reviewer (approve final)</option>' +
        '<option value="admin">admin (akses penuh)</option>' +
      '</select>' +
      '<div id="daAcctMsg" style="font-size:12px;min-height:16px;margin-bottom:6px"></div>' +
      '<button id="daAcctSubmit" style="width:100%;padding:11px;border:none;border-radius:8px;background:#16a085;color:#fff;font-weight:700;cursor:pointer;margin-bottom:8px;font-size:14px">Simpan Akun</button>' +
      '<button id="daAcctCancel" style="width:100%;padding:9px;border:none;border-radius:8px;background:#f3f4f6;color:#4b5563;font-weight:600;cursor:pointer;font-size:13px">Tutup</button>' +
    '</div>';
  document.body.appendChild(wrap);
  document.getElementById('daAcctCancel').onclick = function() {
    if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
  };
  document.getElementById('daAcctSubmit').onclick = function() {
    var u = document.getElementById('daAcctUser').value.trim();
    var p = document.getElementById('daAcctPass').value;
    var n = document.getElementById('daAcctName').value.trim();
    var r = document.getElementById('daAcctRole').value;
    var msgEl = document.getElementById('daAcctMsg');
    if (u.length < 3) { msgEl.style.color = '#e74c3c'; msgEl.textContent = 'Username minimal 3 karakter.'; return; }
    if (p.length < 6) { msgEl.style.color = '#e74c3c'; msgEl.textContent = 'Password minimal 6 karakter.'; return; }
    msgEl.style.color = '#6b7280'; msgEl.textContent = 'Menyimpan...';
    raGetClient().then(function(client) {
      return client.rpc('pm_seed_account', {
        p_username: u, p_password: p, p_role: r, p_display_name: n || null
      });
    }).then(function(res) {
      if (res.error) { msgEl.style.color = '#e74c3c'; msgEl.textContent = res.error.message || 'Gagal menyimpan.'; return; }
      msgEl.style.color = '#16a085';
      msgEl.textContent = '✓ Akun "' + u + '" tersimpan (role: ' + r + '). Login: ' + u + ' / (password yang baru diketik).';
      document.getElementById('daAcctPass').value = '';
    }).catch(function(err) {
      msgEl.style.color = '#e74c3c'; msgEl.textContent = (err && err.message) || String(err);
    });
  };
}

/* ── PRESENCE (Realtime, bukan query database) ──
   Dulu di sini bikin channel('pm-presence', ...) SENDIRI sebagai "penonton"
   -- padahal shared.js (lewat pmInitGate -> pmTrackPresence, jalan otomatis
   di SETIAP halaman termasuk device-admin.html ini sendiri) SUDAH subscribe
   ke channel 'pm-presence' yang sama duluan. Dua kali join ke topic Realtime
   yang sama dari client yang sama bikin konflik di level koneksi, presence
   jadi gak sinkron dengan benar. Sekarang numpang ke channel yang sama lewat
   pmOnPresenceSync() -- tidak ada join/channel baru sama sekali. */
pmOnPresenceSync(function(state) {
  _daOnlineIds = state;
  daRenderList();
});

function daToggleTrust(deviceId, trusted) {
  // access_revoked=true saat dicabut -> device itu dipaksa masukin password
  // lagi di kunjungan berikutnya (bukan cuma kehilangan status Trusted tapi
  // tetap lolos lewat cache password lama). Saat ditandai Trusted lagi,
  // access_revoked direset supaya bersih.
  var patch = { trusted: trusted, access_revoked: !trusted };
  supaFetch('PATCH', 'trusted_devices?device_id=eq.' + encodeURIComponent(deviceId), patch)
    .then(function(){ dbShowToast(trusted ? 'Device ditandai Trusted' : 'Trusted dicabut — device akan diminta password lagi'); daLoadDevices(); })
    .catch(function(err){ alert('Gagal update: ' + (err.message || err)); });
}

function daDeleteDevice(deviceId) {
  if (!confirm('Hapus catatan device ini? Kalau device itu akses lagi nanti, akan dianggap device baru (harus password lagi).')) return;
  supaFetch('DELETE', 'trusted_devices?device_id=eq.' + encodeURIComponent(deviceId))
    .then(function(){ dbShowToast('Device dihapus'); daLoadDevices(); })
    .catch(function(err){ alert('Gagal hapus: ' + (err.message || err)); });
}

daLoadDevices();
</script>

</body>
</html>
