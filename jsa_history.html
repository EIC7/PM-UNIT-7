<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSA History</title>
<script src="shared.js?v=20260904b"></script>
<script src="db-helper.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1420;color:#e7ebf2;padding:8px;overflow-x:hidden}
.container{max-width:1200px;margin:0 auto;background:#161d2c;border-radius:10px;padding:16px;box-shadow:0 2px 16px rgba(0,0,0,0.4);border:1px solid #232c40}
.header{background:linear-gradient(135deg,#1a3a6b,#2e6fcc);color:#fff;padding:16px;border-radius:8px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.header-content h1{font-size:1.25em;margin-bottom:4px}
.header-content p{font-size:0.85em;opacity:0.9}
.header .btn-back{padding:8px 16px;background:#1c2334;color:#bfd6f7;border:1px solid #3a4560;border-radius:6px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:0.9em}
.header .btn-back:hover{background:#232c40}

.tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid #2a3348}
.tab-btn{padding:10px 20px;font-size:0.9em;font-weight:700;border:none;background:transparent;color:#7c8698;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab-btn.active{color:#6fa1e8;border-bottom-color:#6fa1e8}
.tab-btn .cnt{font-weight:500;color:#7c8698;font-size:0.85em}

.manual-table{width:100%;border-collapse:collapse;font-size:12.5px}
.manual-table th{text-align:left;padding:9px 10px;background:#1c2a44;color:#bfd6f7;font-weight:700;border-bottom:1px solid #2a3348;white-space:nowrap}
.manual-table td{padding:9px 10px;border-bottom:1px solid #232c40;color:#dbe1ea;vertical-align:top}
.manual-table tr:last-child td{border-bottom:none}
.badge-risk{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge-low{background:#1c3324;color:#7fd99a}
.badge-high{background:#3a2020;color:#e5695c}
.badge-none{background:#232c40;color:#7c8698}

.btn-aksi{padding:5px 11px;font-size:11px;background:#1c2334;color:#dbe1ea;border:1px solid #3a4560;border-radius:5px;cursor:pointer;margin-right:5px;font-weight:600;white-space:nowrap}
.btn-aksi:hover{background:#232c40}
.btn-aksi.preview{color:#7fb2f0;border-color:#2e6fcc}
.btn-aksi.edit{color:#e3c37a;border-color:#7a5a1a}
.btn-aksi.download{color:#7fd99a;border-color:#1c3324}
.btn-aksi.hapus{color:#e5695c;border-color:#5a2420}
.btn-aksi.drive{color:#8ec9a3;border-color:#1c3324}

.asset-file{display:block;margin-top:3px;font-size:0.78em;color:#7c8698;font-family:'Courier New',monospace}
.empty-msg{text-align:center;padding:30px;color:#7c8698;font-size:13px}
.loading-msg{text-align:center;padding:30px;color:#7c8698;font-size:13px}

/* ── Modal Hapus (konfirmasi ketik "HAPUS") ── */
.jsa-del-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:20000;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;padding:14px}
.jsa-del-modal.show{display:flex}
.jsa-del-dialog{background:#1c2334;border:1px solid #3a4560;border-radius:10px;width:min(94vw,460px);padding:20px}
.jsa-del-dialog h3{color:#e5695c;font-size:1.05em;margin-bottom:14px}
.jsa-del-summary{background:#12182a;border:1px solid #2a3348;border-radius:8px;padding:12px;margin-bottom:14px;font-size:12.5px}
.jsa-del-summary div{padding:3px 0;display:flex;justify-content:space-between;gap:10px}
.jsa-del-summary b{color:#aab4c4;font-weight:600}
.jsa-del-dialog label{display:block;font-size:0.85em;color:#aab4c4;margin-bottom:6px;font-weight:600}
.jsa-del-dialog input{width:100%;padding:10px 12px;border:1px solid #3a4560;border-radius:6px;background:#12182a;color:#e7ebf2;font-size:1em;margin-bottom:14px}
.jsa-del-actions{display:flex;gap:8px;justify-content:flex-end}
.jsa-del-actions button{padding:9px 16px;border-radius:6px;border:none;font-weight:600;cursor:pointer;font-size:0.9em}
.jsa-del-cancel{background:#2a3348;color:#dbe1ea}
.jsa-del-confirm{background:#5a2420;color:#7c8698;cursor:not-allowed}
.jsa-del-confirm.ready{background:#e5695c;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-content">
      <h1>🦺 JOB SAFETY ANALYSIS (JSA) History</h1>
      <p>Riwayat laporan JSA yang sudah dibuat — Conditional Access &amp; Risk To Trip</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn-back" onclick="window.location.href='index.html'">← Kembali ke Dashboard</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="JSA_CONDITION_ACCESS" onclick="jsaHistSwitchTab('JSA_CONDITION_ACCESS')">Conditional Access <span class="cnt" id="cntCA"></span></button>
    <button class="tab-btn" data-tab="JSA_REPORT" onclick="jsaHistSwitchTab('JSA_REPORT')">Risk To Trip <span class="cnt" id="cntRT"></span></button>
  </div>

  <div id="jsaHistList" style="overflow-x:auto"><div class="loading-msg">Memuat riwayat...</div></div>
</div>

<!-- Iframe tersembunyi utk trigger "Download" tanpa membuka tab penuh --
     halaman JSA modul dimuat dgn ?id=...&autodownload=1, begitu selesai
     generate Word (jsaGenerateWord() dipanggil otomatis di sana) iframe
     ini dilepas lagi. Lihat CLAUDE.md. -->
<iframe id="jsaDownloadFrame" style="display:none" title="jsa-download"></iframe>

<!-- Modal konfirmasi Hapus -->
<div class="jsa-del-modal" id="jsaDelModal">
  <div class="jsa-del-dialog">
    <h3>⚠️ Hapus Laporan JSA?</h3>
    <div class="jsa-del-summary" id="jsaDelSummary"></div>
    <label>Ketik <b>HAPUS</b> untuk konfirmasi:</label>
    <input type="text" id="jsaDelConfirmInput" placeholder="HAPUS" autocomplete="off" oninput="jsaDelCheckInput()">
    <div class="jsa-del-actions">
      <button class="jsa-del-cancel" onclick="jsaDelCloseModal()">Batal</button>
      <button class="jsa-del-confirm" id="jsaDelConfirmBtn" onclick="jsaDelConfirmDo()" disabled>🗑 Hapus Permanen</button>
    </div>
  </div>
</div>

<script>
var jsaHistRowsCA = [];
var jsaHistRowsRT = [];
var jsaHistCurrentTab = 'JSA_CONDITION_ACCESS';
var jsaDelTarget = null;

// dbList() (shared.js) SENGAJA cuma ambil kolom ringan (BUKAN `data` JSONB)
// supaya Riwayat umum tetap cepat -- tapi jsa_history.html BUTUH isi
// `data` (equipTag/sigApplicant/riskCategory/epas) utk kolom Asset/
// Applicant/Risk/EPAS. JSA TIDAK PERNAH punya foto evidence (checklist +
// teks murni), jadi `data` JSONB-nya SELALU kecil -- aman diambil penuh
// lewat query khusus ini, beda dari dbList() yang menghindarinya demi
// modul lain yang bisa punya puluhan foto per record.
function jsaHistLoad() {
  supaFetch('GET', 'pm_records?select=id,modul,tanggal,pic,work_order,updated_at,data&modul=ilike.*JSA*&order=updated_at.desc&limit=500')
    .then(function(rows) {
      jsaHistRowsCA = [];
      jsaHistRowsRT = [];
      (rows || []).forEach(function(r) {
        var n = normalizeModul(r.modul);
        if (n === 'JSA_CONDITION_ACCESS') jsaHistRowsCA.push(r);
        else if (n === 'JSA_REPORT') jsaHistRowsRT.push(r);
      });
      document.getElementById('cntCA').textContent = '(' + jsaHistRowsCA.length + ')';
      document.getElementById('cntRT').textContent = '(' + jsaHistRowsRT.length + ')';
      jsaHistRender();
    })
    .catch(function(err) {
      document.getElementById('jsaHistList').innerHTML = '<div class="empty-msg">Gagal memuat riwayat: ' + (err.message || err) + '</div>';
    });
}

function jsaHistSwitchTab(tab) {
  jsaHistCurrentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-tab') === tab);
  });
  jsaHistRender();
}

function jsaRiskBadge(risk) {
  if (risk === 'LOW') return '<span class="badge-risk badge-low">LOW</span>';
  if (risk === 'HIGH') return '<span class="badge-risk badge-high">HIGH</span>';
  return '<span class="badge-risk badge-none">-</span>';
}

// Meniru persis jsaBuildFilename() di jsa_report.html/jsa_condition_access.html
// (WO_Asset, tanpa ekstensi disini) -- SEKEDAR PREVIEW nama file yang akan
// didownload, ditampilkan di bawah kolom Asset. Kalau logic penamaan di
// kedua file modul itu berubah lagi, WAJIB disamakan lagi di sini.
function jsaBuildFilenamePreview(wo, equipTag) {
  var parts = [wo, equipTag].filter(Boolean);
  if (!parts.length) return '';
  return parts.join('_').replace(/\s+/g, '_').replace(/[\\/:*?"<>|]+/g, '') + '.docx';
}

function jsaHistRender() {
  var rows = jsaHistCurrentTab === 'JSA_CONDITION_ACCESS' ? jsaHistRowsCA : jsaHistRowsRT;
  var container = document.getElementById('jsaHistList');
  if (!rows.length) {
    container.innerHTML = '<div class="empty-msg">Belum ada laporan JSA ' + (jsaHistCurrentTab === 'JSA_CONDITION_ACCESS' ? 'Conditional Access' : 'Risk To Trip') + ' tersimpan.</div>';
    return;
  }
  var html = '<table class="manual-table"><thead><tr>' +
    '<th>Asset</th><th>Tanggal</th><th>Applicant</th><th>WO</th><th>Risk</th><th>EPAS</th><th>Aksi</th>' +
    '</tr></thead><tbody>';
  rows.forEach(function(r) {
    var d = r.data || {};
    var applicant = d.sigApplicant || r.pic || '-';
    var url = raModulToUrl(r.modul, r.id);
    var previewUrl = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'autopreview=1';
    var dlUrl = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'autodownload=1';
    var fileName = jsaBuildFilenamePreview(r.work_order, d.equipTag);
    // Link Drive HANYA muncul kalau laporan ini SUDAH PERNAH di-generate
    // Word setelah fitur upload-ke-Drive ini ada (jsaUploadWordToDrive() di
    // jsa_report.html/jsa_condition_access.html) -- laporan lama/yang belum
    // pernah di-generate tidak punya d.wordDriveUrl sama sekali, wajar.
    var driveBtn = d.wordDriveUrl
      ? '<button class="btn-aksi drive" onclick="window.open(\'' + jsaEscHtml(d.wordDriveUrl) + '\',\'_blank\')">📎 Drive</button>'
      : '';
    html += '<tr>' +
      '<td>' + jsaEscHtml(d.equipTag || '-') +
        (fileName ? '<span class="asset-file">📄 ' + jsaEscHtml(fileName) + '</span>' : '') +
      '</td>' +
      '<td>' + (r.tanggal || '-') + '</td>' +
      '<td>' + jsaEscHtml(applicant) + '</td>' +
      '<td>' + jsaEscHtml(r.work_order || '-') + '</td>' +
      '<td>' + jsaRiskBadge(d.riskCategory) + '</td>' +
      '<td>' + jsaEscHtml(d.epas || '-') + '</td>' +
      '<td style="white-space:nowrap">' +
        '<button class="btn-aksi preview" onclick="window.open(\'' + previewUrl + '\',\'_blank\')">👁 Preview</button>' +
        '<button class="btn-aksi edit" onclick="window.location.href=\'' + url + '\'">✎ Edit</button>' +
        '<button class="btn-aksi download" onclick="jsaHistDownload(\'' + dlUrl + '\', this)">⬇ Download</button>' +
        driveBtn +
        '<button class="btn-aksi hapus" onclick=\'jsaDelOpenModal(' + JSON.stringify(JSON.stringify({id:r.id, asset:d.equipTag||'-', tanggal:r.tanggal||'-', applicant:applicant, wo:r.work_order||'-', risk:d.riskCategory||'-', epas:d.epas||'-'})) + ')\'>🗑 Hapus</button>' +
      '</td>' +
    '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function jsaEscHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Download tanpa pindah halaman: muat modul JSA terkait di iframe
// tersembunyi dengan ?autodownload=1 -- halaman itu sendiri yang panggil
// jsaGenerateWord() otomatis begitu record selesai dimuat (lihat blok
// "LOAD FROM HISTORY" di jsa_report.html/jsa_condition_access.html).
function jsaHistDownload(url, btn) {
  var origText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '⏳...';
  var frame = document.getElementById('jsaDownloadFrame');
  frame.src = url;
  setTimeout(function() {
    btn.disabled = false;
    btn.innerHTML = origText;
    frame.src = 'about:blank';
  }, 6000);
}

// ── Hapus (dengan konfirmasi ketik "HAPUS") ──
function jsaDelOpenModal(jsonStr) {
  jsaDelTarget = JSON.parse(jsonStr);
  var t = jsaDelTarget;
  document.getElementById('jsaDelSummary').innerHTML =
    '<div><b>Asset</b><span>' + jsaEscHtml(t.asset) + '</span></div>' +
    '<div><b>Tanggal</b><span>' + jsaEscHtml(t.tanggal) + '</span></div>' +
    '<div><b>Applicant</b><span>' + jsaEscHtml(t.applicant) + '</span></div>' +
    '<div><b>WO</b><span>' + jsaEscHtml(t.wo) + '</span></div>' +
    '<div><b>Risk</b><span>' + jsaEscHtml(t.risk) + '</span></div>' +
    '<div><b>EPAS</b><span>' + jsaEscHtml(t.epas) + '</span></div>';
  document.getElementById('jsaDelConfirmInput').value = '';
  jsaDelCheckInput();
  document.getElementById('jsaDelModal').classList.add('show');
}
function jsaDelCloseModal() {
  document.getElementById('jsaDelModal').classList.remove('show');
  jsaDelTarget = null;
}
function jsaDelCheckInput() {
  // Case-SENSITIVE sengaja -- WAJIB huruf kapital semua "HAPUS", "hapus"/
  // "Hapus" tidak dianggap valid (permintaan eksplisit user).
  var val = (document.getElementById('jsaDelConfirmInput').value || '').trim();
  var btn = document.getElementById('jsaDelConfirmBtn');
  var ready = val === 'HAPUS';
  btn.disabled = !ready;
  btn.classList.toggle('ready', ready);
}
function jsaDelConfirmDo() {
  if (!jsaDelTarget) return;
  var id = jsaDelTarget.id;
  var btn = document.getElementById('jsaDelConfirmBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Menghapus...';
  supaFetch('DELETE', 'pm_records?id=eq.' + id)
    .then(function() {
      jsaDelCloseModal();
      if (typeof dbShowToast === 'function') dbShowToast('Laporan JSA berhasil dihapus ✓');
      jsaHistLoad();
    })
    .catch(function(err) {
      alert('Gagal menghapus: ' + (err.message || err));
      btn.textContent = '🗑 Hapus Permanen';
      btn.disabled = false;
    });
}
document.getElementById('jsaDelModal').addEventListener('click', function(e) {
  if (e.target === this) jsaDelCloseModal();
});

jsaHistLoad();
</script>
</body>
</html>
